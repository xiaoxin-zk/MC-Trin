name: MC-Trin release to GitHub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag to resume'
        required: true
        type: string
      target:
        description: 'GitHub release publication'
        required: true
        default: github
        type: choice
        options:
          - github
  push:
    tags:
      - 'v*'
      - '!v1.9.9'

permissions:
  contents: write

concurrency:
  group: mctrin-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Release preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rustfmt
        run: rustup component add rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release guardrails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test scripts/axolotl/desktop-build-utils.test.mjs
          node --test scripts/axolotl/release-policy.test.mjs
          node --test scripts/axolotl/aliyunoss-release.test.mjs
          node --test scripts/axolotl/set-version.test.mjs
          node --test scripts/axolotl/update-manifest.test.mjs scripts/axolotl/finalize-github-release.test.mjs scripts/axolotl/cnb-release.test.mjs scripts/axolotl/gitlink-release.test.mjs
          node scripts/axolotl/check-migrations.mjs --release
          node scripts/axolotl/brand-guard.mjs
          node scripts/axolotl/i18n-check.mjs
          node --test scripts/axolotl/create-release-notes.test.mjs
          node --test scripts/axolotl/publish-discord-release.test.mjs
          cargo fmt --all --check

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module -e 'import { releaseVersion } from "./scripts/axolotl/release-utils.mjs"; releaseVersion(process.env.RELEASE_TAG)'
          release_notes="${RUNNER_TEMP}/axolotl-release-notes.md"
          node scripts/axolotl/create-release-notes.mjs "${RELEASE_TAG}" "$release_notes"
          if existing_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            if [[ "$existing_draft" != true ]]; then
              echo '::error::Release is already public. Use workflow_dispatch to resume publication without rebuilding.'
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$release_notes"
            exit 0
          fi

          release_args=(
            --draft
            --notes-file "$release_notes"
            --title "MC-Trin ${RELEASE_TAG}"
          )
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${release_args[@]}"

      - name: Prepare build resources
        run: node scripts/axolotl/prepare-build-resources.mjs
      - name: Upload build resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-resources
          path: target/build-resources/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build (Windows x64)
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      SQLX_OFFLINE: true
      CARGO_PROFILE_RELEASE_LTO: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: release
          # A cold tagged build must write its dependency cache back: the
          # release cache is otherwise only produced by prepare-rust-cache.yml
          # and gets evicted from the 10 GiB quota by the ci-host entries.
          save-cache: 'true'
      - name: Set release version
        run: node scripts/axolotl/set-version.mjs "${{ github.ref_name }}"
      - name: Compile application once with full LTO
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/axolotl/build-desktop.mjs --profile release
      - name: Compile Windows installer UI
        if: runner.os == 'Windows'
        run: node scripts/axolotl/build-desktop.mjs --profile release --installer-only
      - name: Package release assets
        run: node scripts/axolotl/package-windows.mjs --profile release --output target/release-assets/upload
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: node scripts/axolotl/upload-release-assets.mjs "$GITHUB_REF_NAME" target/release-assets/upload

  verify-and-publish:
    name: Publish GitHub release
    needs: [build]
    if: >-
      ${{ always() && !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && needs.build.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Publish completed GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$asset_count" -eq 0 ]]; then
            echo '::error::The draft release has no assets.'
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
