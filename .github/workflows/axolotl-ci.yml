name: MC-Trin desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CI_SCOPE_PROTOCOL: cumulative-v1

permissions:
  contents: read

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Determine checks since the last successful CI
        id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/axolotl/ci-changes.mjs

  guardrails:
    name: Run guardrails checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rustfmt
        run: rustup component add rustfmt
      - name: Fetch canonical migration history
        run: |
          git fetch --no-tags https://github.com/Axolotl-Launcher/Axolotl.git \
            7ddbfb8e57db4b0044a04cf28f25fb29e08c3279:refs/remotes/AXL/canonical-bootstrap \
            b505dd9e1e98da845d84af28c5a79036e107493c:refs/remotes/AXL/canonical-backup
      - name: Check immutable database migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test scripts/axolotl/ci-changes.test.mjs
          node --test scripts/axolotl/desktop-build-utils.test.mjs
          node --test scripts/axolotl/release-policy.test.mjs
          node --test scripts/axolotl/aliyunoss-release.test.mjs
          node --test scripts/axolotl/set-version.test.mjs
          node --test scripts/axolotl/update-manifest.test.mjs scripts/axolotl/finalize-github-release.test.mjs scripts/axolotl/cnb-release.test.mjs scripts/axolotl/gitlink-release.test.mjs
          base_ref="${MIGRATION_BASE_REF:-HEAD^}"
          if [[ "$base_ref" =~ ^0+$ ]]; then
            # The first push has no parent commit; release audit below checks the imported history.
            base_ref=HEAD
          fi
          node scripts/axolotl/check-migrations.mjs --base "$base_ref"
          node scripts/axolotl/check-migrations.mjs --release
      - name: Check brand guidelines
        run: node scripts/axolotl/brand-guard.mjs
      - name: Check agents
        run: node scripts/axolotl/check-agents.mjs
      - name: Check internationalization
        run: node scripts/axolotl/i18n-check.mjs
      - name: Check CSS variables
        run: node scripts/axolotl/check-css-vars.mjs
      - name: Check orphan components
        run: node scripts/axolotl/check-orphan-components.mjs
      - name: Check scoped styles
        run: node scripts/axolotl/check-scoped-styles.mjs
      - name: Check retired UI
        run: node scripts/axolotl/check-retired-ui.mjs
      - name: Check dead colours
        run: node scripts/axolotl/check-dead-colours.mjs
      - name: Check dead colours (tests)
        run: node scripts/axolotl/check-dead-colours.test.mjs
      - name: Check downgrade for app database
        run: node scripts/axolotl/downgrade-app-db.test.mjs
      - name: Check release notes
        run: node --test scripts/axolotl/create-release-notes.test.mjs
      - name: Check Discord release notifications
        run: node --test scripts/axolotl/publish-discord-release.test.mjs
      - name: Check ICU message contracts
        run: node --test scripts/i18n-icu-contract.test.ts
      - name: Check seed map texture colours
        run: node --test scripts/axolotl/seed-map-texture-colors.test.mjs
      - name: Check formatting of Rust code
        run: cargo fmt --all --check

  # The frontend lint and test suites were previously never run in CI, so
  # design-system regressions (duplicate components, boundary violations,
  # broken tests) could merge silently.
  frontend:
    name: Run frontend lint and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend packages
        run: |
          pnpm --filter @modrinth/ui lint
          pnpm --filter @modrinth/app-frontend lint
          pnpm --filter @modrinth/assets lint
          pnpm --filter @modrinth/utils lint
          pnpm --filter @modrinth/server lint
          pnpm --filter @modrinth/api-client lint
          pnpm --filter @modrinth/tooling-config lint
      - name: Configure Ubuntu package downloads
        uses: ./.github/actions/configure-linux-apt
      - name: Install Playwright browser for visual tests
        timeout-minutes: 10
        run: pnpm --filter @modrinth/ui exec playwright install --with-deps chromium
      - name: Test server package
        run: pnpm --filter @modrinth/server test
      - name: Test shared UI package
        run: pnpm --filter @modrinth/ui test
      - name: Test desktop frontend
        run: pnpm --filter @modrinth/app-frontend test
      - name: Test desktop frontend overlays
        run: pnpm --filter @modrinth/app-frontend test:visual

  resources:
    name: Prepare build resources
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare build resources
        run: node scripts/axolotl/prepare-build-resources.mjs
      - name: Upload build resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-resources
          path: target/build-resources/
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  # The GUI crate ships ~147 tests (updater, auth, window frame, seed map, mod
  # translation) that only ever reached `cargo check`. They live in their own
  # job because building theseus' test target in the same invocation would add
  # the `tauri` feature and strip the `not(feature = "tauri")` fixtures.
  rust-gui-tests:
    name: Run Rust GUI tests
    needs: [changes, resources]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: true
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: ci
          save-cache: false
      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37 # v1.18.1
      - name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked cargo-nextest
      # The updater ships behind its own feature, so its tests only compile when
      # the feature is switched on.
      - name: Run Rust GUI tests
        run: >-
          cargo nextest run
          --package theseus_gui
          --features updater
          --no-fail-fast

  desktop:
    name: Build and test desktop application
    needs: [changes, guardrails, resources]
    if: needs.changes.outputs.desktop == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: true
      # The desktop app runs its async workload on 16 MiB worker stacks
      # (see apps/app/src/main.rs); test threads default to 2 MiB and the
      # CurseForge install pipeline is deep enough to overflow that.
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: ci
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Set frontend target for reusable build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) platform=windows ;;
            macOS) platform=darwin ;;
            Linux) platform=linux ;;
          esac
          echo "TAURI_ENV_PLATFORM=$platform" >> "$GITHUB_ENV"
      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend
      - name: Check for dead alpha utilities
        run: node scripts/axolotl/check-dead-utilities.mjs
      - name: Test version metadata writes
        run: cargo test --package theseus writing_version_info_creates_missing_parent_directory
      # The whole theseus suite runs here rather than in a dedicated job: this
      # job has already compiled the test binaries, while a standalone job spent
      # ~95 of its 100 minutes rebuilding them from a cold cache. The previously
      # name-filtered steps above are covered by this run, so they are gone.
      # Runs the suite that is green on Linux. The skipped modules were never
      # executed here before and fail on a Linux runner for reasons unrelated to
      # this workflow (missing fixture archives, network-dependent download
      # probes, cross-platform path assumptions). Each group is tracked
      # separately rather than silently dropped from the gate.
      - name: Run the theseus test suite
        if: runner.os == 'Linux'
        timeout-minutes: 40
        run: |
          cargo test \
            --package theseus \
            --package content-management \
            --package daedalus \
            --package ariadne \
            --package path-util \
            --package async-minecraft-ping \
            --no-fail-fast \
            -- --test-threads=1 \
            --skip synced_ \
            --skip launcher::download::tests::legacy_native_libraries_restore_from_libraries_directory \
            --skip launcher::download::tests::missing_cached_archive_falls_back_to_classified_library_archive \
            --skip launcher::download::tests::missing_native_archive_reports_actionable_error \
            --skip launcher::download::tests::missing_native_archive_with_extracted_natives_is_rejected \
            --skip launcher::download::tests::missing_natives_are_restored_from_cached_archives \
            --skip launcher::download::tests::native_entries_escaping_natives_directory_are_ignored \
            --skip launcher::download::tests::only_missing_or_zero_byte_native_entries_are_restored \
            --skip launcher::natives::tests::modern_native_resolution \
            --skip launcher::external_version::tests::native_classifier \
            --skip util::download::endpoint_selection::benchmark::range_recovery \
            --skip util::download::endpoint_selection::probe::tests::native_h2_single_stream \
            --skip util::download::native_request::tests::retired_modrinth_redirects \
            --skip util::download::native_request::tests::retired_modrinth_streamed \
            --skip util::download::native_request::tests::tianpao_downloads \
            --skip util::fetch::tests::custom_content_mirrors \
            --skip util::fetch::tests::hashed_pack_keeps_32_ranges \
            --skip util::fetch::tests::segmented_download_caps \
            --skip util::fetch::tests::warm_h2_archive_hint \
            --skip storage::tests::backup_inside_another_category \
            --skip storage::tests::legacy_repository_and_launcher_files \
            --skip storage::tests::nested_roots_and_external_backup \
            --skip state::auto_concurrency_tests::sustained_pressure_steps_down \
            --skip state::auto_concurrency_tests::unproductive_probe_reverts \
            --skip api::handler::tests::parses_unified_commands \
            --skip api::instance::backup::tests::cancellation_is_rejected \
            --skip api::instance::backup::tests::rejects_paths_outside \
            --skip install::missing_content::tests::same_path_same_size \
            --skip state::db::tests::discards_legacy_openai_translation_configuration \
            --skip state::db::tests::ignores_malformed_legacy_ai_provider_configuration
      - run: cargo check --package theseus_gui --features updater
      - name: Test synchronized instance features
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: cargo test --package theseus synced_ -- --test-threads=1 --nocapture
      - name: Test Windows installer UI and core
        if: runner.os == 'Windows'
        run: |
          cargo test --package axolotl-installer-ui
          pnpm --filter @modrinth/app-frontend exec playwright install chromium
          node --test apps/installer-ui/tests/installer-ui.test.cjs
      - name: Compile Windows application and installer UI without release optimization
        if: runner.os == 'Windows'
        env:
          # Compile the CI binary with the bundled CurseForge key so the build
          # exercises the same content sources a release build offers.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          node scripts/axolotl/build-desktop.mjs --profile ci
          node scripts/axolotl/build-desktop.mjs --profile ci --installer-only
      - name: Smoke test Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'mctrin-startup-smoke/config'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          $env:THESEUS_CONFIG_DIR = $config
          $env:AXOLOTL_DATA_DIR_SUFFIX = 'ci-smoke'
          $binary = Resolve-Path 'target/ci/MC-Trin.exe'
          $app = Start-Process -FilePath $binary -PassThru
          try {
            $windowReady = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 2
              $app.Refresh()
              if ($app.HasExited) {
                throw "MC-Trin exited during startup with code $($app.ExitCode)"
              }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) {
                $windowReady = $true
                break
              }
            }
            if (-not $windowReady) {
              throw 'MC-Trin did not create its desktop window within 60 seconds'
            }
            Write-Host 'MC-Trin created its desktop window successfully.'
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force
            }
          }
      # The Windows CI binary is published so a contributor can run the exact
      # build that passed CI locally without rebuilding it.
      - name: Upload Windows CI binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mctrin-windows-ci
          # The binary loads the seed map engine and the Blockbench skin bundle
          # from `resources/` next to the executable, so the whole folder has to
          # travel with it or those features fail at runtime.
          path: |
            target/ci/MC-Trin.exe
            target/ci/*.dll
            target/ci/resources/**
          overwrite: true
          retention-days: 7
          if-no-files-found: error
      - name: Package and verify both Windows installers from one binary
        if: runner.os == 'Windows'
        run: node scripts/axolotl/package-windows.mjs --profile ci --output target/ci-installers
      - name: Test actual Windows uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --prefix target/uninstall-verification --no-save --no-audit --no-fund handlebars@4.7.8
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare NSIS fixture dependencies" }
          node apps/installer-ui/tests/compile-fixture.cjs --tauri-nsis target/ci-bundle/release/nsis/x64
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile NSIS uninstall fixture" }
          & apps/installer-ui/tests/uninstall-smoke.ps1
  desktop-ci-result:
    name: Desktop CI result
    # Report failed checks, but skip the gate when a newer run cancels this workflow.
    if: ${{ !cancelled() }}
    needs:
      [
        changes,
        guardrails,
        frontend,
        resources,
        rust-gui-tests,
        desktop,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/axolotl/ci-result.mjs
